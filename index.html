<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10233f"><title>Apuração 2026</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#142033;--muted:#66758a;--blue:#1d5ea8;--green:#16845b;--line:#dce4ee;--soft:#eaf1f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}header{background:#10233f;color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:10}header h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;opacity:.8}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.tab{border:1px solid #54708e;background:#173454;color:white;border-radius:10px;padding:10px 5px;font-weight:700}.tab.on{background:white;color:#10233f}.toolbar{display:flex;gap:8px;align-items:center;padding:12px 12px 0;max-width:900px;margin:auto}.toolbar select,.toolbar button{font:inherit;border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px}.toolbar select{flex:1}.toolbar button{font-weight:700;color:var(--blue)}main{max-width:900px;margin:auto;padding:12px}.status{font-size:12px;color:var(--muted);padding:0 3px 10px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:11px;overflow:hidden}.head{padding:13px 14px 9px}.headrow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.place{font-size:17px;font-weight:800}.pct{font-weight:800;color:var(--blue)}.progress{height:9px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}.meta{font-size:11px;color:var(--muted);margin-top:7px}.cands{border-top:1px solid var(--line)}.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 14px;border-bottom:1px solid #edf1f5}.cand:last-child{border:0}.name{font-weight:700}.party{font-size:11px;color:var(--muted);margin-top:2px}.votes{text-align:right}.votes b{font-size:16px}.votes small{display:block;color:var(--muted)}.lead{color:var(--green)}.empty,.error{padding:22px 15px;text-align:center;color:var(--muted)}.error{color:#9a3e3e}.national{border:2px solid #9bb8d7}.national .head{background:#f1f7fd}.foot{text-align:center;color:var(--muted);font-size:11px;padding:12px 14px 25px}.spin{display:inline-block;width:13px;height:13px;border:2px solid #c7d2df;border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:430px){header{padding-left:12px;padding-right:12px}.tab{font-size:12px}.toolbar{padding-left:10px;padding-right:10px}main{padding:10px}.cand{padding-left:12px;padding-right:12px}}
</style></head><body><header><h1>Apuração 2026</h1><div class="sub">Dados oficiais do Tribunal Superior Eleitoral • 1º turno</div><div class="tabs"><button class="tab on" data-cargo="1">Presidente</button><button class="tab" data-cargo="3">Governador</button><button class="tab" data-cargo="5">Senador</button></div></header><div class="toolbar"><select id="uf" aria-label="Estado"></select><button id="refresh">Atualizar</button></div><main><div id="status" class="status"><span class="spin"></span>Carregando dados oficiais…</div><div id="cards"></div><div class="foot">Fonte: arquivos públicos de divulgação de resultados do TSE. Este é um painel independente, sem vínculo com a Justiça Eleitoral.</div></main><script>
const BASE='https://resultados.tse.jus.br/oficial', FED='6257', EST='6259';
const UFS=[['ac','Acre'],['al','Alagoas'],['am','Amazonas'],['ap','Amapá'],['ba','Bahia'],['ce','Ceará'],['df','Distrito Federal'],['es','Espírito Santo'],['go','Goiás'],['ma','Maranhão'],['mg','Minas Gerais'],['ms','Mato Grosso do Sul'],['mt','Mato Grosso'],['pa','Pará'],['pb','Paraíba'],['pe','Pernambuco'],['pi','Piauí'],['pr','Paraná'],['rj','Rio de Janeiro'],['rn','Rio Grande do Norte'],['ro','Rondônia'],['rr','Roraima'],['rs','Rio Grande do Sul'],['sc','Santa Catarina'],['se','Sergipe'],['sp','São Paulo'],['to','Tocantins']];
const nomes=Object.fromEntries(UFS); nomes.br='Brasil'; let cargo=1, selected='mg', timer=null;
const $=s=>document.querySelector(s), cards=$('#cards'), status=$('#status'), ufsel=$('#uf');
UFS.forEach(([u,n])=>ufsel.add(new Option(`${u.toUpperCase()} — ${n}`,u))); ufsel.value=selected;
function pad(v,n){return String(v).padStart(n,'0')} function url(abr,c){const e=c===1?FED:EST;return `${BASE}/ele2026/${e}/dados/${abr}/${abr}-c${pad(c,4)}-e${pad(e,6)}-u.json`}
function num(v){const n=parseInt(String(v??'').replace(/\D/g,''),10);return Number.isFinite(n)?n:0} function dec(v){let s=String(v??'0').trim(); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s);return Number.isFinite(n)?n:0} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function parse(j){const cg=j?.carg?.[0]||{}, out=[];for(const a of cg.agr||[])for(const p of a.par||[])for(const c of p.cand||[])out.push({nome:c.nmu||c.nm||'',partido:p.sg||'',numero:c.n||'',votos:num(c.vap),pct:dec(c.pvap),st:c.st||''});out.sort((a,b)=>b.votos-a.votos||b.pct-a.pct);return {pct:dec(j?.s?.pst),st:num(j?.s?.st),ts:num(j?.s?.ts),dg:j?.dg||'',hg:j?.hg||'',final:String(j?.tf||'').toLowerCase()==='s',vagas:num(cg.nv)|| (cargo===5?2:1),cands:out}}
async function get(abr,c){const r=await fetch(url(abr,c),{cache:'no-store'});if(!r.ok)throw new Error(`TSE respondeu ${r.status}`);return parse(await r.json())}
function fmt(n){return n.toLocaleString('pt-BR')} function pct(n){return n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'}
function card(abr,d,national=false){const compact=cargo===1&&!national;const shown=compact?d.cands.slice(0,2):d.cands;let list=shown.map((c,i)=>`<div class="cand"><div><div class="name ${i<d.vagas?'lead':''}">${!compact&&i<d.vagas&&c.votos>0?'● ':''}${esc(c.nome)}</div>${compact?'':`<div class="party">${esc(c.partido)}${c.numero?' • '+esc(c.numero):''}${c.st?' • '+esc(c.st):''}</div>`}</div><div class="votes"><b>${pct(c.pct)}</b>${compact?'':`<small>${fmt(c.votos)} votos</small>`}</div></div>`).join('');if(!list)list='<div class="empty">Aguardando votos divulgados pelo TSE.</div>';return `<section class="card ${national?'national':''}"><div class="head"><div class="headrow"><div class="place">${abr==='br'?'🇧🇷 ':''}${esc(nomes[abr]||abr.toUpperCase())}</div><div class="pct">${pct(d.pct)} apurado</div></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,d.pct))}%"></i></div>${compact?'':`<div class="meta">${fmt(d.st)} de ${fmt(d.ts)} seções${d.dg?` • TSE: ${esc(d.dg)} ${esc(d.hg)}`:''}${d.final?' • TOTALIZAÇÃO FINAL':''}</div>`}</div><div class="cands">${list}</div></section>`}
async function load(){clearTimeout(timer);status.innerHTML='<span class="spin"></span>Atualizando dados oficiais do TSE…';cards.innerHTML='';try{if(cargo===1){ufsel.disabled=true;const targets=[['br','Brasil'],...UFS];const results=await Promise.allSettled(targets.map(([u])=>get(u,1)));let html='';results.forEach((r,i)=>{const u=targets[i][0];html+=r.status==='fulfilled'?card(u,r.value,u==='br'):`<section class="card"><div class="head"><div class="place">${esc(nomes[u])}</div></div><div class="error">Não foi possível obter este estado agora.</div></section>`});cards.innerHTML=html}else{ufsel.disabled=false;const d=await get(selected,cargo);cards.innerHTML=card(selected,d)}status.textContent='Última consulta deste painel: '+new Date().toLocaleTimeString('pt-BR')+' • atualização automática a cada 60 segundos.'}catch(e){cards.innerHTML=`<div class="card error">Não consegui acessar os dados do TSE agora. Verifique a internet e toque em Atualizar.<br><small>${esc(e.message)}</small></div>`;status.textContent='Falha na atualização.'}timer=setTimeout(load,60000)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{cargo=+b.dataset.cargo;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));load()}));ufsel.addEventListener('change',()=>{selected=ufsel.value;load()});$('#refresh').addEventListener('click',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();
</script></body></html>
